<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Cyber ground: wet dark asphalt with a faint neon grid, small puddles with pink and cyan reflections
       and glints of light (seamless 240 x 240 tile: the grid lines sit inside the tile, every 60).
       Original art for this app. -->
  <rect width="240" height="240" fill="#1a1d33"/>
  <!-- asphalt grain -->
  <g fill="#232741">
    <circle cx="14" cy="22" r="1.2"/><circle cx="52" cy="74" r="1"/><circle cx="104" cy="12" r="1.3"/><circle cx="168" cy="52" r="1"/><circle cx="214" cy="96" r="1.2"/>
    <circle cx="70" cy="132" r="1.1"/><circle cx="132" cy="168" r="1"/><circle cx="196" cy="206" r="1.3"/><circle cx="24" cy="186" r="1"/><circle cx="118" cy="226" r="1.2"/>
    <circle cx="160" cy="114" r="0.9"/><circle cx="226" cy="150" r="1"/><circle cx="84" cy="196" r="0.9"/><circle cx="40" cy="104" r="0.9"/>
  </g>
  <g fill="#14162a">
    <circle cx="34" cy="48" r="1.2"/><circle cx="142" cy="36" r="1"/><circle cx="188" cy="12" r="1.1"/><circle cx="96" cy="96" r="1.2"/><circle cx="12" cy="142" r="1"/>
    <circle cx="178" cy="146" r="1.2"/><circle cx="58" cy="216" r="1.1"/><circle cx="150" cy="200" r="1"/><circle cx="222" cy="232" r="1"/><circle cx="110" cy="146" r="0.9"/>
  </g>
  <!-- the neon grid -->
  <path d="M30 0 V240 M90 0 V240 M150 0 V240 M210 0 V240 M0 30 H240 M0 90 H240 M0 150 H240 M0 210 H240" stroke="#22e3f5" stroke-width="1" opacity="0.08"/>
  <g fill="#22e3f5" opacity="0.22">
    <circle cx="90" cy="90" r="1.3"/><circle cx="210" cy="150" r="1.3"/><circle cx="30" cy="210" r="1.3"/><circle cx="150" cy="30" r="1.3"/>
  </g>
  <!-- small puddles with reflections -->
  <path d="M46 160 Q58 152 76 156 Q88 160 80 168 Q66 174 52 170 Q40 166 46 160 Z" fill="#22274a" opacity="0.6"/>
  <path d="M52 162 H70 M58 166 H78" stroke="#ff3fa4" stroke-width="1" opacity="0.32" stroke-linecap="round"/>
  <path d="M166 66 Q180 60 196 64 Q204 70 194 74 Q178 78 168 74 Q160 70 166 66 Z" fill="#22274a" opacity="0.6"/>
  <path d="M172 68 H190 M176 72 H186" stroke="#22e3f5" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <path d="M120 112 Q128 108 138 110 Q142 114 136 117 Q126 119 120 116 Q116 114 120 112 Z" fill="#22274a" opacity="0.55"/>
  <path d="M123 113 H134" stroke="#b46bff" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <!-- glints and stray reflections -->
  <g stroke-linecap="round" opacity="0.3">
    <path d="M200 120 h14" stroke="#ff3fa4" stroke-width="1"/>
    <path d="M16 72 h10" stroke="#22e3f5" stroke-width="1"/>
    <path d="M100 206 h12" stroke="#22e3f5" stroke-width="1"/>
    <path d="M126 20 h9" stroke="#ff3fa4" stroke-width="1"/>
  </g>
  <g fill="#bff8ff" opacity="0.45">
    <circle cx="64" cy="158" r="0.8"/><circle cx="184" cy="66" r="0.8"/><circle cx="20" cy="118" r="0.7"/><circle cx="222" cy="44" r="0.7"/><circle cx="140" cy="186" r="0.7"/>
  </g>
</svg>
