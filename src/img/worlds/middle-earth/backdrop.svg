<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="400" viewBox="0 0 2400 400">
  <!-- Middle-earth backdrop: a green shire at golden hour - far misty mountains, patchwork fields, round
       doors in grassy hills, a great party tree, a mill by a pond. Original art for this app. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78b0e0"/>
      <stop offset="0.45" stop-color="#b6dbef"/>
      <stop offset="0.72" stop-color="#f3ecd0"/>
      <stop offset="1" stop-color="#f8dfa6"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="1"/>
      <stop offset="0.18" stop-color="#fff0bd" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffe6a6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa3c2"/>
      <stop offset="1" stop-color="#cbd7e2"/>
    </linearGradient>
    <linearGradient id="mountainsNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db3b9"/>
      <stop offset="1" stop-color="#c7d4cd"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efd6" stop-opacity="0"/>
      <stop offset="1" stop-color="#f7efd6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="farHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5d08c"/>
      <stop offset="1" stop-color="#9ec274"/>
    </linearGradient>
    <linearGradient id="midHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc867"/>
      <stop offset="1" stop-color="#84b455"/>
    </linearGradient>
    <linearGradient id="nearHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc15c"/>
      <stop offset="0.6" stop-color="#7cad4c"/>
      <stop offset="1" stop-color="#729f45"/>
    </linearGradient>
    <linearGradient id="hillLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fff3c4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cb25d"/>
      <stop offset="1" stop-color="#86a95a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d4e8"/>
      <stop offset="1" stop-color="#6aa3c4"/>
    </linearGradient>
    <linearGradient id="thatch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b86a"/>
      <stop offset="1" stop-color="#b8924a"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3b22"/>
      <stop offset="0.5" stop-color="#7a5332"/>
      <stop offset="1" stop-color="#4d321d"/>
    </linearGradient>
    <radialGradient id="window" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="1" stop-color="#f2c565"/>
    </radialGradient>

    <!-- A round door set in a stone ring (door color = the use's color) -->
    <g id="hole">
      <ellipse cx="0" cy="34" rx="40" ry="7" fill="#5f8c3c" opacity="0.45"/>
      <circle r="34" fill="#cdb995"/>
      <path d="M0 -34 V-26 M24 -24 L18.4 -18.4 M34 0 H26 M24 24 L18.4 18.4 M-24 24 L-18.4 18.4 M-34 0 H-26 M-24 -24 L-18.4 -18.4" stroke="#a48f6c" stroke-width="2.4"/>
      <circle r="34" fill="none" stroke="#96805d" stroke-width="2"/>
      <circle r="26" fill="currentColor"/>
      <path d="M-13 -22.5 V22.5 M0 -26 V26 M13 -22.5 V22.5" stroke="#000000" stroke-opacity="0.16" stroke-width="2"/>
      <path d="M-20 -16 A26 26 0 0 1 16 -20" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round"/>
      <circle r="26" fill="none" stroke="#000000" stroke-opacity="0.32" stroke-width="2.5"/>
      <circle r="4.2" fill="#f1cc5c" stroke="#8f6c16" stroke-width="1.2"/>
      <path d="M-30 32 H30 L26 39 H-26 Z" fill="#b9a47e" stroke="#94805d" stroke-width="1.2"/>
    </g>
    <!-- A round window with a warm glow and a flower box -->
    <g id="porthole">
      <circle r="15" fill="#7a5531"/>
      <circle r="11.5" fill="url(#window)"/>
      <path d="M0 -11.5 V11.5 M-11.5 0 H11.5" stroke="#7a5531" stroke-width="2.4"/>
      <rect x="-16" y="14" width="32" height="7" rx="2" fill="#8a5a2f" stroke="#5f3d1f" stroke-width="1"/>
      <circle cx="-11" cy="12" r="3.6" fill="#e2566a"/>
      <circle cx="-4" cy="11" r="3.6" fill="#f5c84a"/>
      <circle cx="3" cy="12" r="3.6" fill="#ffffff"/>
      <circle cx="10" cy="11" r="3.6" fill="#d45ba8"/>
      <circle cx="-7" cy="14" r="2.6" fill="#4e8a32"/>
      <circle cx="7" cy="14" r="2.6" fill="#4e8a32"/>
    </g>
    <!-- A brick chimney with a curl of smoke -->
    <g id="chimney">
      <path d="M-8 0 V-26 H8 V0 Z" fill="#9c5a3c" stroke="#6e3c26" stroke-width="1.2"/>
      <path d="M-10 -26 H10 V-31 H-10 Z" fill="#7d4630" stroke="#5a301f" stroke-width="1"/>
      <path d="M-8 -18 H8 M-8 -10 H8 M0 -26 V-18 M-4 -18 V-10 M4 -10 V0" stroke="#6e3c26" stroke-width="0.8" opacity="0.7"/>
      <g fill="#f4f1ea">
        <ellipse cx="2" cy="-40" rx="7" ry="5" opacity="0.75"/>
        <ellipse cx="10" cy="-52" rx="9" ry="6" opacity="0.6"/>
        <ellipse cx="22" cy="-64" rx="11" ry="7" opacity="0.45"/>
        <ellipse cx="38" cy="-73" rx="13" ry="7" opacity="0.3"/>
      </g>
    </g>
    <!-- A round leafy tree -->
    <g id="tree">
      <path d="M-4 0 Q-3 -14 -2 -24 H2 Q3 -14 4 0 Z" fill="#6b4a2c"/>
      <circle cx="0" cy="-34" r="17" fill="#4f8a34"/>
      <circle cx="-11" cy="-26" r="12" fill="#467e2e"/>
      <circle cx="11" cy="-27" r="12" fill="#558f38"/>
      <circle cx="-5" cy="-42" r="9" fill="#67a344"/>
    </g>
    <!-- A garden: picket fence and flowers -->
    <g id="flowers">
      <circle cx="0" cy="0" r="4" fill="#4e8a32"/>
      <circle cx="8" cy="-2" r="4.4" fill="#4e8a32"/>
      <circle cx="16" cy="0" r="4" fill="#4e8a32"/>
      <circle cx="-1" cy="-4" r="2.4" fill="#e2566a"/>
      <circle cx="5" cy="-6" r="2.4" fill="#ffffff"/>
      <circle cx="11" cy="-7" r="2.4" fill="#f5c84a"/>
      <circle cx="17" cy="-4" r="2.4" fill="#d45ba8"/>
      <circle cx="8" cy="-1" r="2" fill="#f08a3c"/>
    </g>
    <g id="sheep">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="#f7f4ec"/>
      <circle cx="-6" cy="-3" r="4" fill="#f7f4ec"/>
      <circle cx="5" cy="-3" r="4" fill="#f7f4ec"/>
      <ellipse cx="10" cy="-1" rx="3.4" ry="2.8" fill="#3a3230"/>
      <path d="M-5 5 V9 M4 5 V9" stroke="#3a3230" stroke-width="1.6"/>
    </g>
  </defs>

