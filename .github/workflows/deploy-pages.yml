name: Deploy to GitHub Pages

# On every push to main: run the unit tests, then publish the static app in src/ to GitHub Pages.
# config.js (Supabase URL + publishable key) is generated here from repository Variables, so it is
# never committed. Without those Variables the app simply runs in local-only mode.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.js from repository variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        # JSON.stringify quotes the values safely, whatever characters they contain.
        run: |
          node -e '
            const value = name => JSON.stringify(process.env[name] || "");
            require("fs").writeFileSync("src/config.js",
              `export const SUPABASE_URL = ${value("SUPABASE_URL")};\nexport const SUPABASE_ANON_KEY = ${value("SUPABASE_ANON_KEY")};\n`);
          '

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (src/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: src

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
